interface:
  display_name: "CAD -> WCS 布局映射"
  short_description: "提取 CAD 设备与明确箭头，生成 WCS 设备表和可编辑布局页面"
  default_prompt: "Use $cad-wcs-layout to convert a DXF layout into a WCS CSV and editable monitor, preserving extractable CAD arrows and leaving unknown directions blank."
policy:
  allow_implicit_invocation: true
